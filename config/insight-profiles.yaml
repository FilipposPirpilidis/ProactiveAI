default_profile: general

profiles:
  - id: general
    display_name: General
    preferred_insights:
      - definition
      - technical_context
      - mechanism

  - id: software_engineering
    display_name: Software Engineering
    signals:
      - source code
      - API
      - database
      - Docker
      - backend
      - frontend
      - deployment
      - repository
    preferred_insights:
      - definition
      - mechanism
      - implementation_option
      - tradeoff
      - troubleshooting_step
    terms:
      API:
        aliases: [application programming interface]
        importance: medium
      REST:
        aliases: [RESTful]
        importance: medium
      WebSocket:
        aliases: [web socket]
        importance: high
      dependency injection:
        aliases: [DI]
        importance: high
        requires_context: [code, dependency, service, container]
      structured concurrency:
        aliases: [task group, async task]
        importance: high
      reactive programming:
        aliases: [reactive stream, publisher subscriber]
        importance: high

  - id: ios_development
    display_name: iOS Development
    signals:
      - Swift
      - SwiftUI
      - UIKit
      - Xcode
      - view controller
      - iOS
      - Apple framework
    preferred_insights:
      - definition
      - mechanism
      - platform_difference
      - implementation_option
      - tradeoff
    terms:
      Combine:
        aliases: [Combine framework]
        importance: high
        requires_context: [Swift, SwiftUI, publisher, subscriber, iOS]
        canonical_requires_context: true
      ObservableObject:
        aliases: [observable object, observable]
        importance: high
        requires_context: [Swift, SwiftUI, state, property, view]
      Observation:
        aliases: [Observation framework, observable macro]
        importance: high
        requires_context: [Swift, SwiftUI, macro, state]
      "@Published":
        aliases: [published property, published wrapper]
        importance: high
        requires_context: [Swift, SwiftUI, Combine, ObservableObject]
      loadView:
        aliases: [load view]
        importance: high
        requires_context: [UIViewController, view controller, UIKit]
      NIB:
        aliases: [NIP, nib file]
        importance: medium
        requires_context: [UIKit, storyboard, XIB, view]
      XIB:
        aliases: [xib file]
        importance: medium
        requires_context: [UIKit, storyboard, NIB, view]
      intrinsicContentSize:
        aliases: [intrinsic content size]
        importance: high
        requires_context: [UIKit, Auto Layout, UIView, view]
      Auto Layout:
        aliases: [autolayout, layout constraints]
        importance: high
        requires_context: [UIKit, SwiftUI, UIView, constraints]
      MainActor:
        aliases: [main actor]
        importance: high
        requires_context: [Swift, concurrency, UI, actor]

  - id: physics
    display_name: Physics
    signals:
      - physics
      - force
      - energy
      - velocity
      - particle
      - quantum
      - electromagnetic
    preferred_insights:
      - definition
      - mechanism
      - calculation
      - misconception_correction
    terms:
      momentum:
        aliases: [linear momentum]
        importance: high
      entropy:
        aliases: [thermodynamic entropy]
        importance: high
      wave-particle duality:
        aliases: [wave particle duality]
        importance: high
      electromagnetic induction:
        aliases: [induction]
        importance: high
        requires_context: [magnetic, electric, current, voltage]

  - id: finance
    display_name: Finance
    signals:
      - investment
      - interest rate
      - stock
      - bond
      - inflation
      - portfolio
    current_information: true
    preferred_insights:
      - definition
      - mechanism
      - risk_or_constraint
    terms:
      compound interest:
        aliases: [compounding]
        importance: high
      exchange-traded fund:
        aliases: [ETF]
        importance: high
      price-to-earnings ratio:
        aliases: [P/E ratio, PE ratio]
        importance: high

  - id: politics_news
    display_name: Politics and News
    signals:
      - election
      - parliament
      - government
      - minister
      - breaking news
      - policy
    current_information: true
    preferred_insights:
      - definition
      - institutional_context
      - verification_required
    terms:
      coalition government:
        aliases: [coalition]
        importance: medium
      proportional representation:
        aliases: [PR system]
        importance: high
      executive order:
        aliases: []
        importance: high
