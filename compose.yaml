services:
  proactive-ai:
    build:
      context: .
    image: homebuddy/proactive-ai:local
    restart: unless-stopped
    ports:
      - "18743:18743"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.68.112:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:cloud}
      AUTH_USERNAME: ${AUTH_USERNAME:-homebuddy}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-123456}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      DETECTOR_MODE: ${DETECTOR_MODE:-conversate}
      PARTIAL_INSIGHT_DEBOUNCE_MS: ${PARTIAL_INSIGHT_DEBOUNCE_MS:-400}
      PARTIAL_INSIGHT_INTERVAL_MS: ${PARTIAL_INSIGHT_INTERVAL_MS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_PATH: /data/homebuddy.db
    volumes:
      - homebuddy-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  simulator:
    image: homebuddy/proactive-ai:local
    profiles: ["simulator"]
    depends_on:
      proactive-ai:
        condition: service_healthy
    environment:
      SIMULATOR_WS_URL: ws://proactive-ai:18743/v1/ws
      SIMULATOR_TEXT_FILE: /input/sample-transcript.txt
      AUTH_USERNAME: ${AUTH_USERNAME:-homebuddy}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-123456}
    volumes:
      - ./simulator-input:/input:ro
    command: ["python", "scripts/simulator.py", "file"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  homebuddy-data:
