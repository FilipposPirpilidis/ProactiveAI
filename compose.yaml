services:
  proactive-ai:
    build:
      context: .
    image: homebuddy/proactive-ai:local
    restart: unless-stopped
    ports:
      - "18743:18743"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.68.112:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-5.3-flash:cloud}
      TRIGGER_OLLAMA_BASE_URL: ${TRIGGER_OLLAMA_BASE_URL:-}
      TRIGGER_OLLAMA_MODEL: ${TRIGGER_OLLAMA_MODEL:-}
      TRIGGER_OLLAMA_TIMEOUT_SECONDS: ${TRIGGER_OLLAMA_TIMEOUT_SECONDS:-20}
      INSIGHT_OLLAMA_BASE_URL: ${INSIGHT_OLLAMA_BASE_URL:-}
      INSIGHT_OLLAMA_MODEL: ${INSIGHT_OLLAMA_MODEL:-}
      INSIGHT_OLLAMA_TIMEOUT_SECONDS: ${INSIGHT_OLLAMA_TIMEOUT_SECONDS:-30}
      AUTH_USERNAME: ${AUTH_USERNAME:-homebuddy}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-123456}
      AUTH_STATIC_TOKEN: ${AUTH_STATIC_TOKEN:-}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      DETECTOR_MODE: ${DETECTOR_MODE:-conversate}
      CONVERSATE_RULES_PATH: /config/conversate-rules.md
      PARTIAL_INSIGHT_DEBOUNCE_MS: ${PARTIAL_INSIGHT_DEBOUNCE_MS:-650}
      PARTIAL_INSIGHT_INTERVAL_MS: ${PARTIAL_INSIGHT_INTERVAL_MS:-2000}
      PARTIAL_INSIGHT_COOLDOWN_SECONDS: ${PARTIAL_INSIGHT_COOLDOWN_SECONDS:-12}
      PARTIAL_INSIGHT_MIN_WORDS: ${PARTIAL_INSIGHT_MIN_WORDS:-7}
      PARTIAL_INSIGHT_MIN_CONFIDENCE: ${PARTIAL_INSIGHT_MIN_CONFIDENCE:-0.85}
      PARTIAL_INSIGHT_MAX_AGE_SECONDS: ${PARTIAL_INSIGHT_MAX_AGE_SECONDS:-8}
      FINAL_INSIGHT_MAX_AGE_SECONDS: ${FINAL_INSIGHT_MAX_AGE_SECONDS:-30}
      TOPIC_OBSERVER_ENABLED: ${TOPIC_OBSERVER_ENABLED:-true}
      TOPIC_OBSERVER_DEBOUNCE_MS: ${TOPIC_OBSERVER_DEBOUNCE_MS:-4000}
      TOPIC_OBSERVER_INTERVAL_MS: ${TOPIC_OBSERVER_INTERVAL_MS:-8000}
      TOPIC_OBSERVER_MIN_WORDS: ${TOPIC_OBSERVER_MIN_WORDS:-35}
      TOPIC_OBSERVER_MIN_CONFIDENCE: ${TOPIC_OBSERVER_MIN_CONFIDENCE:-0.86}
      TOPIC_OBSERVER_MAX_AGE_SECONDS: ${TOPIC_OBSERVER_MAX_AGE_SECONDS:-90}
      TOPIC_OBSERVER_CONTEXT_ITEMS: ${TOPIC_OBSERVER_CONTEXT_ITEMS:-24}
      QUESTION_OBSERVER_ENABLED: ${QUESTION_OBSERVER_ENABLED:-true}
      QUESTION_INSIGHT_POLICY: ${QUESTION_INSIGHT_POLICY:-always}
      QUESTION_ANSWER_GRACE_SECONDS: ${QUESTION_ANSWER_GRACE_SECONDS:-2}
      QUESTION_TRACKING_SECONDS: ${QUESTION_TRACKING_SECONDS:-15}
      QUESTION_VERIFICATION_CONFIDENCE: ${QUESTION_VERIFICATION_CONFIDENCE:-0.90}
      QUESTION_OBSERVER_CONTEXT_ITEMS: ${QUESTION_OBSERVER_CONTEXT_ITEMS:-10}
      TRANSCRIPT_WINDOW_SECONDS: ${TRANSCRIPT_WINDOW_SECONDS:-180}
      INSIGHT_TARGET_CHARACTERS: ${INSIGHT_TARGET_CHARACTERS:-260}
      INSIGHT_MAX_CHARACTERS: ${INSIGHT_MAX_CHARACTERS:-340}
      SESSION_ANALYSIS_MAX_CHARACTERS: ${SESSION_ANALYSIS_MAX_CHARACTERS:-60000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_PATH: /data/homebuddy.db
    volumes:
      - homebuddy-data:/data
      - ./config/conversate-rules.md:/config/conversate-rules.md:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  simulator:
    image: homebuddy/proactive-ai:local
    profiles: ["simulator"]
    depends_on:
      proactive-ai:
        condition: service_healthy
    environment:
      SIMULATOR_WS_URL: ws://proactive-ai:18743/v1/ws
      SIMULATOR_TEXT_FILE: /input/sample-transcript.txt
      AUTH_USERNAME: ${AUTH_USERNAME:-homebuddy}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-123456}
    volumes:
      - ./simulator-input:/input:ro
    command: ["python", "scripts/simulator.py", "file"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  homebuddy-data:
