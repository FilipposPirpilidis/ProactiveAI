# Test-only credentials for the local end-to-end simulator.
# Never use this override for a deployed HomeBuddy service.
services:
  proactive-ai:
    environment:
      AUTH_USERNAME: ${TEST_AUTH_USERNAME:-homebuddy-test}
      AUTH_PASSWORD: ${TEST_AUTH_PASSWORD:-homebuddy-e2e-only-do-not-deploy}

  simulator:
    environment:
      AUTH_USERNAME: ${TEST_AUTH_USERNAME:-homebuddy-test}
      AUTH_PASSWORD: ${TEST_AUTH_PASSWORD:-homebuddy-e2e-only-do-not-deploy}
