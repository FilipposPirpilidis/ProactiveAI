[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homebuddy-proactive-ai"
version = "0.2.0"
description = "Containerized proactive AI pipeline for HomeBuddy smart glasses"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
